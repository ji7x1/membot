<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة ميم</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* التزامن الكامل مع ثيم تليجرام */
        :root {
            --bg-color: var(--tg-theme-bg-color, #f0f2f5);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --primary: var(--tg-theme-button-color, #1877f2);
            --text-main: var(--tg-theme-text-color, #1c1e21);
            --text-muted: var(--tg-theme-hint-color, #65676b);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 80px; transition: all 0.3s ease; }
        
        .header { background: var(--card-bg); padding: 15px; text-align: center; border-bottom: 1px solid rgba(128,128,128,0.2); }
        .header h2 { margin: 0; color: var(--primary); font-size: 22px; }
        
        /* تأثيرات حركية (Animations) */
        .product-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transform: scale(1); transition: transform 0.2s; }
        .product-card:active { transform: scale(0.98); }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .btn-action { background: var(--primary); color: var(--btn-text); border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 5px;}
        
        .form-section { background: var(--card-bg); padding: 15px; margin: 15px; border-radius: 12px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(128,128,128,0.3); background: var(--bg-color); color: var(--text-main); box-sizing: border-box; }
        
        .tools-row { display: flex; gap: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>📚 مكتبة ميم</h2>
    </div>

    <!-- زر الماسح الضوئي -->
    <div style="padding: 0 15px; margin-top: 15px;">
        <button class="btn-action" onclick="scanQR()">📷 امسح باركود الملزمة</button>
    </div>

    <div class="product-card">
        <div class="flex-between">
            <div>
                <h3 style="margin:0 0 5px 0;">ملزمة بلدوزر التحصيلي</h3>
                <span style="color: var(--primary); font-weight: bold;">15,000 د.ع</span>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="btn-action" style="width: auto; margin:0;" onclick="updateCart('ملزمة بلدوزر التحصيلي', 15000, -1)">-</button>
                <span id="qty-ملزمة بلدوزر التحصيلي" style="font-weight:bold;">0</span>
                <button class="btn-action" style="width: auto; margin:0;" onclick="updateCart('ملزمة بلدوزر التحصيلي', 15000, 1)">+</button>
            </div>
        </div>
    </div>

    <div class="form-section">
        <h3>📍 معلومات التوصيل:</h3>
        <input type="text" id="fullName" placeholder="الاسم الكامل" onchange="saveData()">
        <input type="tel" id="phone" placeholder="رقم الهاتف" onchange="saveData()">
        
        <div class="tools-row">
            <input type="text" id="address" placeholder="العنوان التفصيلي" onchange="saveData()">
            <button class="btn-action" style="width: 45px; margin:0;" onclick="getLocation()">📍</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        
        let cart = {};
        let total = 0;

        // 1. استرجاع البيانات من التخزين السحابي عند الفتح
        tg.CloudStorage.getItem('userData', function(err, value) {
            if (!err && value) {
                let data = JSON.parse(value);
                document.getElementById('fullName').value = data.name || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('address').value = data.address || '';
            }
        });

        // 2. حفظ البيانات سحابياً (تعمل تلقائياً عند الكتابة)
        function saveData() {
            let data = {
                name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value
            };
            tg.CloudStorage.setItem('userData', JSON.stringify(data));
        }

        // 3. نظام الاهتزاز مع السلة
        function updateCart(name, price, change) {
            tg.HapticFeedback.impactOccurred('light'); // اهتزاز خفيف
            
            if (!cart[name]) cart[name] = { price: price, qty: 0 };
            cart[name].qty += change;
            if (cart[name].qty < 0) cart[name].qty = 0;
            
            document.getElementById('qty-' + name).innerText = cart[name].qty;
            if (cart[name].qty === 0) delete cart[name];
            
            updateMainButton();
        }

        function updateMainButton() {
            total = 0;
            for (let key in cart) total += cart[key].price * cart[key].qty;
            
            if (total > 0) {
                tg.MainButton.text = `تأكيد الطلب | ${total.toLocaleString()} د.ع`;
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        // 4. الماسح الضوئي (QR Scanner)
        function scanQR() {
            tg.HapticFeedback.impactOccurred('medium');
            tg.showScanQrPopup({text: "وجّه الكاميرا نحو باركود الملزمة"}, function(text) {
                tg.showAlert("تم قراءة الكود: " + text);
                return true; 
            });
        }

        // 5. سحب الموقع الجغرافي (GPS)
        function getLocation() {
            tg.HapticFeedback.impactOccurred('medium');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let locText = `احداثيات: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`;
                    document.getElementById('address').value = locText;
                    saveData();
                    tg.showAlert("تم سحب الموقع بنجاح!");
                }, function() {
                    tg.showAlert("يرجى تفعيل صلاحية الموقع من إعدادات الهاتف.");
                });
            }
        }

        // إرسال الطلب
        Telegram.WebApp.onEvent('mainButtonClicked', function(){
            tg.HapticFeedback.notificationOccurred('success'); // اهتزاز نجاح قوي
            
            let name = document.getElementById('fullName').value;
            let phone = document.getElementById('phone').value;
            let address = document.getElementById('address').value;

            if(!name || !phone || !address) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("رجاءً املأ كل المعلومات!");
                return;
            }

            let itemsArray = [];
            for (let key in cart) itemsArray.push({ name: `${cart[key].qty}x ${key}`, price: cart[key].price * cart[key].qty });

            tg.sendData(JSON.stringify({ customer_name: name, customer_phone: phone, customer_address: address, items: itemsArray, total_price: total })); 
        });
    </script>
</body>
</html>
