<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة ميم</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0b0f19; --card: #131c2e; --neon: #00f0ff; --text: #fff; --success: #10b981; --accent: #ff007f; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }
        
        .header { text-align: center; padding: 20px; border-bottom: 1px solid rgba(0,240,255,0.2); box-shadow: 0 0 15px rgba(0,240,255,0.1); }
        .header h2 { margin: 0; color: var(--neon); text-shadow: 0 0 10px rgba(0,240,255,0.4); }
        
        .container { padding: 15px; }
        .main-btn { background: var(--card); border: 1px solid var(--neon); color: var(--text); padding: 18px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: bold; margin-bottom: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; transition: 0.2s;}
        .main-btn:active { transform: scale(0.97); background: rgba(0,240,255,0.1); }
        
        .grid-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .item-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.08); }
        .action-btn { background: var(--neon); color: #000; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:100; backdrop-filter: blur(5px); }
        .modal-box { background: var(--card); padding: 20px; border-radius: 15px; width: 85%; border: 1px solid var(--neon); }
        
        .nav-bar { display: none; padding: 12px 15px; background: rgba(0,240,255,0.1); margin-bottom: 15px; cursor: pointer; color: var(--neon); font-weight: bold; text-align: center; border-radius: 10px; }
        
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); padding: 15px; box-sizing: border-box; border-top: 1px solid var(--neon); display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .checkout-box { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index:200; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .checkout-box input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; box-sizing: border-box; outline: none;}
        .checkout-box input:focus { border-color: var(--neon); }
        .promo-container { display: flex; gap: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="header"><h2>📚 مكتبة ميم</h2><p>النظام الذكي للطلبات</p></div>
    
    <div class="container" id="contentArea">
        <div id="view-main">
            <button class="main-btn" onclick="openSection('books')">📘 الكتب المدرسية <span style="color:var(--neon);">🡐</span></button>
            <button class="main-btn" onclick="openSection('malazim')">📙 الملازم الدراسية <span style="color:var(--neon);">🡐</span></button>
        </div>
    </div>
    <div class="container" style="padding-top:0;">
        <div class="nav-bar" id="navBar" onclick="goBack()">🔙 عودة للقائمة الرئيسية</div>
    </div>

    <!-- نافذة المدرسين -->
    <div class="modal" id="teacherModal">
        <div class="modal-box">
            <h3 id="teacherModalTitle" style="margin-top:0; color:var(--neon);">اختر المدرس</h3>
            <div class="grid-list" id="teachersList"></div>
            <button class="action-btn" style="width:100%; margin-top:15px; background:#444; color:white;" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <!-- شريط السلة -->
    <div class="cart-bar" id="cartBar" style="display:none;">
        <div id="cartTotalText">الإجمالي: 0 د.ع</div>
        <button class="action-btn" onclick="openCheckout()">إتمام الطلب 🛒</button>
    </div>

    <!-- صفحة الدفع -->
    <div class="checkout-box" id="checkoutView">
        <h2 style="color:var(--neon); margin-top:0;">فاتورة الطلب</h2>
        <div id="checkoutCartItems" style="margin-bottom:15px; font-size:14px; color:#aaa; max-height:150px; overflow-y:auto; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px;"></div>
        
        <!-- نظام الكوبونات -->
        <div class="promo-container">
            <input type="text" id="promoCode" placeholder="كود الخصم (إن وجد)" style="margin:0;">
            <button class="action-btn" onclick="applyPromo()" style="white-space: nowrap;">تفعيل</button>
        </div>

        <input type="text" id="custName" placeholder="الاسم الكامل">
        <input type="tel" id="custPhone" placeholder="رقم الهاتف">
        <input type="text" id="custAddress" placeholder="المحافظة - المنطقة - أقرب نقطة دالة">
        
        <button class="main-btn" style="justify-content:center; margin-top:10px; background:var(--success); color:black; border:none;" onclick="submitOrder()">تأكيد الطلب ✅</button>
        <button class="main-btn" style="justify-content:center; margin-top:5px; background:rgba(255,255,255,0.1); border:none;" onclick="closeCheckout()">رجوع للمتجر</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        let currentMode = ''; 
        let cart = {};
        let totalCartPrice = 0;
        let finalPrice = 0;
        let discountApplied = false;
        
        const dataConfig = {
            stages: [
                { id: 'primary', name: 'المرحلة الابتدائية' },
                { id: 'middle', name: 'المرحلة المتوسطة' },
                { id: 'high', name: 'المرحلة الإعدادية' }
            ],
            grades: {
                primary: ['الأول الابتدائي', 'الثاني الابتدائي', 'الثالث الابتدائي', 'الرابع الابتدائي', 'الخامس الابتدائي', 'السادس الابتدائي'],
                middle: ['الأول المتوسط', 'الثاني المتوسط', 'الثالث المتوسط'],
                high: ['الرابع الإعدادي', 'الخامس الإعدادي', 'السادس الإعدادي']
            },
            subjectsBase: ['الرياضيات', 'العلوم', 'اللغة الإنجليزية', 'اللغة العربية', 'التربية الإسلامية']
        };

        const teachers = ['أ. حيدر وليد', 'أ. حيدر عبد الأئمة'];
        let selectedSubjectTemp = '';
        let selectedGradeTemp = '';

        function renderHTML(html) { document.getElementById('contentArea').innerHTML = html; }

        function openSection(mode) {
            tg.HapticFeedback.impactOccurred('light');
            currentMode = mode;
            document.getElementById('navBar').style.display = 'block';
            let html = '<div class="grid-list">';
            dataConfig.stages.forEach(s => {
                html += `<button class="main-btn" onclick="openStage('${s.id}')">${s.name} <span style="color:var(--text-muted);">🡐</span></button>`;
            });
            html += '</div>';
            renderHTML(html);
        }

        function openStage(stageId) {
            tg.HapticFeedback.impactOccurred('light');
            let html = '<div class="grid-list">';
            let availableGrades = dataConfig.grades[stageId];
            
            if(currentMode === 'malazim' && stageId === 'primary') {
                availableGrades = ['الرابع الابتدائي', 'الخامس الابتدائي', 'السادس الابتدائي'];
            }

            availableGrades.forEach(g => {
                html += `<div class="item-card" onclick="openSubjects('${g}', '${stageId}')">
                            <b style="font-size:15px;">${g}</b>
                            <span style="color:var(--neon); font-size:12px; font-weight:bold;">عرض المواد 🡐</span>
                         </div>`;
            });
            html += '</div>';
            renderHTML(html);
        }

        function openSubjects(grade, stageId) {
            tg.HapticFeedback.impactOccurred('medium');
            let html = '<div class="grid-list">';
            let subs = [...dataConfig.subjectsBase];
            
            if(stageId !== 'high') subs.push('الاجتماعيات');

            if(currentMode === 'books') {
                html += `<div class="item-card" style="border-color:var(--success); background:rgba(16, 185, 129, 0.05);">
                            <div><b style="color:var(--success);">باكج دراسي كامل</b><br><span style="font-size:12px; color:#aaa;">جميع المواد المنهجية</span></div>
                            <button class="action-btn" style="background:var(--success); color:white;" onclick="addToCart('${grade} - باكج كامل', 25000)">25,000 د.ع</button>
                         </div>`;
                         
                subs.forEach(s => {
                    html += `<div class="item-card">
                                <b>كتاب ${s}</b>
                                <button class="action-btn" onclick="addToCart('${grade} - كتاب ${s}', 5000)">5,000 د.ع</button>
                             </div>`;
                });
            } else {
                subs.forEach(s => {
                    html += `<div class="item-card" onclick="showTeachers('${grade}', '${s}')">
                                <b>ملزمة ${s}</b>
                                <span style="color:var(--neon); font-size:12px; border: 1px solid var(--neon); padding: 4px 8px; border-radius: 6px;">اختر المدرس</span>
                             </div>`;
                });
            }
            html += '</div>';
            renderHTML(html);
        }

        function showTeachers(grade, subject) {
            selectedGradeTemp = grade;
            selectedSubjectTemp = subject;
            document.getElementById('teacherModalTitle').innerText = `مدرسي ${subject}`;
            let html = '';
            teachers.forEach(t => {
                html += `<div class="item-card" style="margin-bottom:8px;">
                            <b>${t}</b>
                            <button class="action-btn" onclick="addMalzama('${t}')">إضافة للسلة</button>
                         </div>`;
            });
            document.getElementById('teachersList').innerHTML = html;
            document.getElementById('teacherModal').style.display = 'flex';
        }

        function addMalzama(teacherName) {
            let itemName = `${selectedGradeTemp} - ملزمة ${selectedSubjectTemp} (${teacherName})`;
            addToCart(itemName, 10000); 
            closeModal();
        }

        function closeModal() { document.getElementById('teacherModal').style.display = 'none'; }

        function addToCart(name, price) {
            tg.HapticFeedback.notificationOccurred('success');
            if(!cart[name]) cart[name] = { price: price, qty: 1 };
            else cart[name].qty++;
            updateCartBar();
            tg.showAlert(`✅ تمت إضافة ${name} للسلة`);
        }

        function updateCartBar() {
            totalCartPrice = 0;
            for(let k in cart) totalCartPrice += cart[k].price * cart[k].qty;
            finalPrice = totalCartPrice;
            if(discountApplied) finalPrice = totalCartPrice * 0.9;
            
            if(totalCartPrice > 0) {
                document.getElementById('cartTotalText').innerHTML = `الإجمالي: <b style="color:var(--neon);">${finalPrice.toLocaleString()} د.ع</b>`;
                document.getElementById('cartBar').style.display = 'flex';
            }
        }

        function applyPromo() {
            let code = document.getElementById('promoCode').value.toUpperCase().trim();
            if (code === 'ALI2026') {
                tg.HapticFeedback.notificationOccurred('success');
                discountApplied = true;
                updateCartBar();
                updateCheckoutCart();
                tg.showAlert("🎉 تم تفعيل الخصم 10% بنجاح!");
            } else {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("❌ الكود غير صحيح أو منتهي الصلاحية.");
            }
        }

        function updateCheckoutCart() {
            let html = '';
            for(let k in cart) html += `<div style="margin-bottom:5px;">▪️ ${cart[k].qty}x ${k} = ${(cart[k].price * cart[k].qty).toLocaleString()} د.ع</div>`;
            if(discountApplied) {
                html += `<hr style="border-color:#333;"><div style="color:var(--success);">خصم الكود: -${(totalCartPrice * 0.1).toLocaleString()} د.ع</div>`;
            }
            html += `<h3 style="color:white; margin-bottom:0;">المطلوب: ${finalPrice.toLocaleString()} د.ع</h3>`;
            document.getElementById('checkoutCartItems').innerHTML = html;
        }

        function openCheckout() {
            updateCheckoutCart();
            document.getElementById('checkoutView').style.display = 'block';
        }

        function closeCheckout() { document.getElementById('checkoutView').style.display = 'none'; }

        function goBack() {
            tg.HapticFeedback.impactOccurred('light');
            document.getElementById('navBar').style.display = 'none';
            let html = `
                <div id="view-main">
                    <button class="main-btn" onclick="openSection('books')">📘 الكتب المدرسية <span style="color:var(--neon);">🡐</span></button>
                    <button class="main-btn" onclick="openSection('malazim')">📙 الملازم الدراسية <span style="color:var(--neon);">🡐</span></button>
                </div>
            `;
            renderHTML(html);
            document.getElementById('cartBar').style.display = 'none';
            cart = {}; updateCartBar();
        }

        function submitOrder() {
            let name = document.getElementById('custName').value.trim();
            let phone = document.getElementById('custPhone').value.trim();
            let addr = document.getElementById('custAddress').value.trim();
            if(!name || !phone || !addr) {
                tg.HapticFeedback.notificationOccurred('error');
                return tg.showAlert('⚠️ يرجى ملء كافة معلومات التوصيل!');
            }
            
            tg.HapticFeedback.notificationOccurred('success');
            let itemsArr = [];
            for(let k in cart) itemsArr.push({ name: `${cart[k].qty}x ${k}`, price: cart[k].price * cart[k].qty });
            
            let data = { customer_name: name, customer_phone: phone, customer_address: addr, items: itemsArr, total_price: finalPrice, discount: discountApplied };
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
